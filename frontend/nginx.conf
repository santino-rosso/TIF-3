server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Alternativa para SPA — requerido para React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker: nunca debe almacenarse en caché de forma agresiva.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    # Variante de trabajador de servicio generado por caja de trabajo
    location = /workbox-*.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # Manifiesto PWA — generado por vite-plugin-pwa como manifest.webmanifest
    location = /manifest.webmanifest {
        # nginx mime.types ya asigna .webmanifest; forzar explícitamente
        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Gestionar también /manifest.json si alguna vez se genera
    location = /manifest.json {
        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Recursos estáticos — inmutables, caché agresiva (Vite añade hashes a los nombres de archivo)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
